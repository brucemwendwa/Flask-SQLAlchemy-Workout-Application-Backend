[pytest]
testpaths = server/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The pinned Werkzeug 2.2.2 uses ast.Str, which newer Python versions deprecate.
# It is noise from a dependency, not from this project, so keep it out of the report.
filterwarnings =
    ignore:ast.Str is deprecated:DeprecationWarning
    ignore:Attribute s is deprecated:DeprecationWarning
    ignore:Constant.__init__:DeprecationWarning
